<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Charge Nurse Checklist</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="Shift checklist for charge nurses. Runs offline on your phone; nothing leaves the device.">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

<!-- Add to Home Screen: full-screen, no Safari chrome -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Charge">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="top">
  <div class="wrap topbar">
    <a class="mark" href="./">Charge.</a>
    <div class="status" id="status" aria-live="polite"></div>
    <button class="menu-btn" data-act="menu" aria-label="Report, past shifts and settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <div class="meter" aria-hidden="true"><div class="meter-fill" id="meter"></div></div>
</header>

<div class="scroller" id="scroller">
  <section class="hero" id="hdr" aria-label="Summary"></section>
  <main class="wrap" id="app"></main>
</div>

<nav class="tabbar" id="tabs" aria-label="Pages"></nav>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet"></div></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- rendered only when printing / saving a PDF -->
<div id="printout"></div>

<script src="js/template.js"></script>
<script src="js/config.js"></script>
<script src="js/push.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
